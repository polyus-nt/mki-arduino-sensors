[platformio]
default_envs = uno

[env:uno]
platform = atmelavr
board = uno
framework = arduino
build_flags = -std=gnu++11

; Provided BMP pins overlap default Austere: this build must reject that map.
[env:uno_bmp_compile_check]
extends = env:uno
build_flags =
  -std=gnu++11
  -DAPI_BMP_SCL_PIN=2
  -DAPI_BMP_SDA0_PIN=3
  -DAPI_BMP_SDA1_PIN=4
  -DAPI_BMP_SDA2_PIN=5
