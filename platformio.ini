[platformio]
default_envs = uno

[env:uno]
platform = atmelavr
board = uno
framework = arduino
lib_deps =
  paulstoffregen/OneWire@^2.3.8
build_flags = -std=gnu++11
build_src_filter = +<main.cpp>

; Draft hardware API, BMP280/VOC stubs, no guessed new sensor pinout.
[env:api_uno_stub]
platform = atmelavr
board = uno
framework = arduino
build_flags = -std=gnu++11
build_src_filter = +<hardware_api_main.cpp>
