[platformio]
default_envs = uno

[env:uno]
platform = atmelavr
board = uno
framework = arduino
build_flags = -std=gnu++11

; Provided BMP pins overlap default Austere: this build must reject that map.
[env:uno_bmp_compile_check]
extends = env:uno
build_flags =
  -std=gnu++11
  -DHARDWARE_API_BOARD_HEADER=\"test/compile_only_bmp.h\"

; Compile-only valid nonoverlapping map: NOT approved wiring, never flash.
[env:uno_sensors_compile_check]
extends = env:uno
build_flags =
  -std=gnu++11
  -DHARDWARE_API_BOARD_HEADER=\"test/compile_only_sensors.h\"
